<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="app active">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-brand-logo">MF</div>
      <span>Mwirigi Farm</span>
    </div>
    <div class="topbar-user">
      <div class="topbar-user-info">
        <div class="topbar-user-name">John Doe</div>
        <div class="topbar-user-role">Admin</div>
      </div>
      <button class="topbar-logout">Logout</button>
    </div>
  </div>
  <div class="sidebar">
    <div class="side-group-label">Navigation</div>
    <div class="side-item active">Dashboard</div>
    <div class="side-item">Reports</div>
    <div class="side-item">Settings</div>
  </div>
  <div class="main">
    <h1>Welcome to the Dashboard</h1>
    <p>Here you can manage all the farm operations.</p>
  </div>
</div>
</body>
</html>
