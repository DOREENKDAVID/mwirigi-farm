<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">MF</div>
      <div>
        <div class="login-title">Mwirigi Farm</div>
        <div class="login-sub">Management System</div>
      </div>
    </div>
    <div class="login-hdr">Select Role</div>
    <button class="role-btn">
      <div class="role-avatar">A</div>
      <div>
        <div class="role-name">Admin</div>
        <div class="role-desc">Manage the entire system</div>
      </div>
    </button>
    <button class="role-btn">
      <div class="role-avatar">U</div>
      <div>
        <div class="role-name">User</div>
        <div class="role-desc">Access your dashboard</div>
      </div>
    </button>
  </div>
</div>
</body>
</html>
